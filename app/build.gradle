plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.dockeep.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.dockeep.app"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only sign when a keystore is actually configured. Assigning the
            // config unconditionally made assembleRelease fail outright with
            // "missing required property storeFile" on any machine without
            // app/keystore.properties — which is every fresh clone. Without
            // one the build now produces an unsigned APK instead.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    
    // Room database
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.room:room-ktx:2.5.0'
    ksp 'androidx.room:room-compiler:2.5.0'
    
    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.1.0'
    
    // Activity Result APIs
    implementation 'androidx.activity:activity-ktx:1.8.0'
    
    // Zip utility
    implementation 'org.apache.commons:commons-compress:1.24.0'
    
    // PDF generation uses android.graphics.pdf.PdfDocument from the
    // platform. iText 7 was the desktop JVM build and is not supported on
    // Android; see utils/LedgerPdf.kt.

    // Document scanning: live edge detection, perspective correction and the
    // enhance filters. Delivered as a Play Services module, downloaded on
    // first use, so the APK does not carry the model itself.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // Crop / rotate / straighten for scans already in a document.
    implementation 'com.vanniktech:android-image-cropper:4.6.0'

    // On-device OCR. Bundled rather than the Play Services variant so text
    // extraction still works where the scanner had to fall back to the
    // plain camera.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Biometric / device-credential lock for the vault.
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}